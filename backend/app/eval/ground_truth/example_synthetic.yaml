# =============================================================================
# GROUND TRUTH -- SYNTHETIC EXAMPLE
# =============================================================================
# Every value in this file is FABRICATED. It exists to document the schema and
# to give the harness something to run against in CI without shipping real
# vendor PII. Real ground truth files (<vendor_slug>.yaml) are gitignored.
#
# See README.md in this directory before creating one -- in particular the rule
# that ground truth must never be generated by running the extractor.
# =============================================================================

vendor_id: example_synthetic
verified: true                     # set true only after a human checks every field
verified_by: synthetic-fixture
verified_on: 2026-08-14

# Paths are relative to the directory passed to the harness via --documents.
documents:
  gst_certificate: GST CERTIFICATE.PDF
  cancelled_cheque: Cancelled Cheque.pdf
  udyam_certificate: UdyamRegistrationCertificate.pdf

# Where the supplied documents contradict each other, record the decision and
# why. The harness prints these alongside the score so a reviewer can see which
# calls were judgement rather than transcription.
conflicts:
  - field: bank_name
    note: >-
      Udyam certificate lists a different bank from the cancelled cheque.
      Cheque wins: it is the account being onboarded for payment.

fields:

  # -- identity -------------------------------------------------------------
  vendor_name:
    value: EXAMPLE WIDGETS PRIVATE LIMITED
    source: gst_certificate
  company_type:
    value: Private Limited Company
    source: gst_certificate
  nature_of_business:
    value: MANUFACTURING
    source: udyam_certificate

  # -- statutory identifiers ------------------------------------------------
  gst_number:
    value: 29AAACE1234F1Z5
    source: gst_certificate
  pan:
    value: AAACE1234F
    source: udyam_certificate
  udyam_number:
    value: UDYAM-KA-03-0001234
    source: udyam_certificate
  tan:
    absent: true                   # not printed on any supplied document
  esic_number:
    absent: true

  # -- address --------------------------------------------------------------
  address_1:
    value: 2ND FLOOR
    source: gst_certificate
  address_2:
    value: 14 EXAMPLE ROAD
    source: gst_certificate
  address_3:
    absent: true
  address_4:
    absent: true
  city:
    value: BENGALURU
    source: gst_certificate
  state:
    value: Karnataka
    source: gst_certificate
  country:
    value: India
    source: inferred               # not printed; supplied by config default
  pin_code:
    value: "560001"
    source: gst_certificate

  # -- contact --------------------------------------------------------------
  telephone:
    value: "9000000000"
    source: udyam_certificate
  email:
    value: accounts@example-widgets.in
    source: udyam_certificate
  website:
    absent: true

  # -- banking (from the cancelled cheque; see conflicts above) -------------
  bank_name:
    value: HDFC Bank
    source: cancelled_cheque
  branch_address:
    value: Example Branch, 1 Sample Street, Bengaluru, Karnataka-560002
    source: cancelled_cheque
  ifsc:
    value: HDFC0001234
    source: cancelled_cheque
  account_number:
    value: "50200012345678"
    source: cancelled_cheque
  account_type:
    value: CURRENT
    source: cancelled_cheque
