[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Import the backend's packages (app, vendor_extractor, cli, eval) without an
# install step -- the app is run in place, not pip-installed. Run pytest from
# the backend/ directory, which is what uvicorn uses as its working directory
# too.
pythonpath = .

addopts = --strict-markers --tb=short -m "not slow"

markers =
    slow: runs real OCR end to end (seconds to minutes); opt in with `-m slow`
